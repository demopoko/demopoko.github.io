<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptos NFT Explorer & Bulk Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- JSZip and FileSaver for Zip Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root {
            --bg-primary: #0b0f17;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 229, 153, 0.4);
            
            --accent-primary: #00e599;
            --accent-hover: #00b377;
            --accent-glow: rgba(0, 229, 153, 0.15);
            --accent-blue: #3b82f6;
            --danger-color: #ef4444;
            
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px var(--accent-glow);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 229, 153, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            background: rgba(11, 15, 23, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .brand-title { display: flex; align-items: center; gap: 0.75rem; }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-blue));
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            color: #000;
            font-weight: 800;
            font-size: 1.1rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { font-size: 0.85rem; color: var(--text-secondary); }
        .header-meta { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-primary);
        }

        .address-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-full);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-primary);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: var(--transition);
        }
        .btn-icon:hover { color: var(--accent-primary); }

        .stats-section {
            margin: 2rem 0 1.5rem 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-card);
            transition: var(--transition);
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); }

        .controls-section { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 280px; position: relative; }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-glow);
        }

        .filter-toggle-btn, .download-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 0.75rem 1.25rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .download-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-blue));
            color: #000;
            border: none;
        }
        .download-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        .filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
        }
        .filter-panel.open { display: grid; }

        .filter-group-title { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase; }
        .filter-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            color: var(--text-primary);
            outline: none;
        }

        .status-container { margin-bottom: 1.5rem; }
        .status-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-blue));
            width: 0%;
            transition: width 0.3s ease;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 640px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 1.25rem; } }
        @media (min-width: 1024px) { .gallery-grid { grid-template-columns: repeat(4, 1fr); gap: 1.5rem; } }
        @media (min-width: 1280px) { .gallery-grid { grid-template-columns: repeat(5, 1fr); } }

        /* NFT Card with Serial & Delete */
        .nft-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .nft-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow);
        }

        .serial-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--accent-primary);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            z-index: 5;
            border: 1px solid var(--border-glass);
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 68, 68, 0.85);
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-weight: bold;
            transition: var(--transition);
        }
        .delete-btn:hover { background: var(--danger-color); transform: scale(1.1); }

        .nft-image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0, 0, 0, 0.4);
            position: relative;
            cursor: pointer;
        }

        .nft-image { width: 100%; height: 100%; object-fit: cover; }

        .nft-info {
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .nft-name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .load-more-container { display: flex; justify-content: center; margin: 2rem 0 4rem 0; }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #00b377);
            color: #000;
            font-weight: 700;
            padding: 0.85rem 2rem;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-container {
            background: var(--bg-secondary); border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg); max-width: 800px; width: 100%; max-height: 90vh;
            overflow-y: auto; position: relative; padding: 1.5rem;
        }
        .modal-close-btn { position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
        .modal-body { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media (min-width: 640px) { .modal-body { grid-template-columns: 300px 1fr; } }
        .modal-media { width: 100%; border-radius: var(--radius-md); aspect-ratio: 1/1; object-fit: contain; background: #000; }
        .traits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.5rem; margin-top: 1rem; }
        .trait-card { background: rgba(0,229,153,0.05); border: 1px solid rgba(0,229,153,0.2); padding: 0.5rem; border-radius: 6px; text-align: center; }
        .trait-type { font-size: 0.7rem; color: var(--accent-primary); }
        .trait-value { font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand-title">
                <div class="brand-logo">A</div>
                <div>
                    <h1>Aptos NFT Explorer</h1>
                    <div class="subtitle">Full Collection Batch Importer</div>
                </div>
            </div>
            <div class="header-meta">
                <div class="badge"><span class="badge-dot"></span><span>Aptos Mainnet</span></div>
                <div class="address-box"><span id="collectionAddressShort">0xef50...e946</span></div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-label">Collection Name</div>
                <div class="stat-value" id="statCollectionName">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total NFTs Discovered</div>
                <div class="stat-value" id="statTotalNFTs">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active / Loaded NFTs</div>
                <div class="stat-value" id="statLoadedNFTs">0</div>
            </div>
        </section>

        <section class="controls-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name, ID or traits...">
            </div>
            <button id="downloadZipBtn" class="download-btn">
                <span>Download All (ZIP)</span>
            </button>
        </section>

        <div id="statusContainer" class="status-container">
            <div class="status-bar">
                <div>
                    <div id="statusState" style="font-weight:700;">Connecting...</div>
                    <div id="statusText" style="font-size:0.8rem; color:var(--text-secondary);">Fetching collection dataset...</div>
                </div>
                <div id="statusCount">0 / 0</div>
            </div>
            <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        </div>

        <div id="galleryGrid" class="gallery-grid"></div>

        <div id="loadMoreContainer" class="load-more-container" style="display:none;">
            <button id="loadMoreBtn" class="btn-primary">Load More</button>
        </div>
    </main>

    <!-- Modal -->
    <div id="nftModal" class="modal-overlay">
        <div class="modal-container">
            <button id="modalCloseBtn" class="modal-close-btn">&times;</button>
            <div class="modal-body">
                <img id="modalMedia" class="modal-media" src="" alt="">
                <div>
                    <h2 id="modalNFTName">NFT Name</h2>
                    <p id="modalNFTDescription" style="font-size:0.85rem; color:var(--text-secondary); margin: 0.5rem 0;"></p>
                    <div class="traits-grid" id="modalTraitsGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const COLLECTION_ADDRESS = "0xef50cde1a5ffaea0cd0671a0f17de69ad6172eaaa673c8136d0a8e319ca9e946";
        const INDEXER_URL = "https://indexer.mainnet.aptoslabs.com/v1/graphql";
        const IPFS_GATEWAYS = ["https://ipfs.io/ipfs/", "https://gateway.pinata.cloud/ipfs/"];

        const state = {
            loadedNFTs: [],
            filteredNFTs: [],
            renderedCount: 0,
            pageSize: 50,
            searchQuery: ""
        };

        const elements = {
            statCollectionName: document.getElementById('statCollectionName'),
            statTotalNFTs: document.getElementById('statTotalNFTs'),
            statLoadedNFTs: document.getElementById('statLoadedNFTs'),
            searchInput: document.getElementById('searchInput'),
            downloadZipBtn: document.getElementById('downloadZipBtn'),
            galleryGrid: document.getElementById('galleryGrid'),
            loadMoreContainer: document.getElementById('loadMoreContainer'),
            loadMoreBtn: document.getElementById('loadMoreBtn'),
            statusContainer: document.getElementById('statusContainer'),
            statusState: document.getElementById('statusState'),
            statusText: document.getElementById('statusText'),
            statusCount: document.getElementById('statusCount'),
            progressFill: document.getElementById('progressFill'),
            nftModal: document.getElementById('nftModal'),
            modalCloseBtn: document.getElementById('modalCloseBtn'),
            modalMedia: document.getElementById('modalMedia'),
            modalNFTName: document.getElementById('modalNFTName'),
            modalNFTDescription: document.getElementById('modalNFTDescription'),
            modalTraitsGrid: document.getElementById('modalTraitsGrid')
        };

        window.addEventListener('DOMContentLoaded', () => {
            setupUIHandlers();
            initializeExplorer();
        });

        function setupUIHandlers() {
            elements.searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value.toLowerCase().trim();
                applySearchAndFilters();
            });

            elements.loadMoreBtn.addEventListener('click', () => renderNextBatch());
            elements.downloadZipBtn.addEventListener('click', () => downloadCollectionZip());
            elements.modalCloseBtn.addEventListener('click', closeModal);
        }

        function resolveURI(uri) {
            if (!uri) return '';
            uri = uri.trim();
            if (uri.startsWith('ipfs://')) return `${IPFS_GATEWAYS[0]}${uri.replace('ipfs://', '')}`;
            if (uri.startsWith('ar://')) return `https://arweave.net/${uri.replace('ar://', '')}`;
            return uri;
        }

        async function fetchJSON(url, retries = 2) {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (err) {
                if (retries > 0) return fetchJSON(url, retries - 1);
                return null;
            }
        }

        async function initializeExplorer() {
            try {
                let allTokens = [];
                let hasMore = true;
                let offset = 0;
                const fetchLimit = 1000;

                const query = `
                    query GetCollectionTokens($collection_id: String!, $limit: Int!, $offset: Int!) {
                        current_token_datas_v2(
                            where: { collection_id: { _eq: $collection_id } },
                            limit: $limit,
                            offset: $offset
                        ) {
                            token_data_id
                            token_name
                            token_uri
                            description
                            current_collection { collection_name creator_address }
                        }
                    }
                `;

                // Fetching all 7000 NFTs without hard limits
                while (hasMore) {
                    updateStatus("Discovering", `Fetching NFT list (${allTokens.length} fetched)...`, allTokens.length, 7000);
                    const res = await fetch(INDEXER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query, variables: { collection_id: COLLECTION_ADDRESS, limit: fetchLimit, offset } })
                    }).then(r => r.json());

                    const tokens = res.data?.current_token_datas_v2 || [];
                    allTokens = allTokens.concat(tokens);

                    if (tokens.length < fetchLimit) hasMore = false;
                    else offset += fetchLimit;
                }

                elements.statTotalNFTs.textContent = allTokens.length.toLocaleString();
                if (allTokens.length > 0) elements.statCollectionName.textContent = allTokens[0].current_collection?.collection_name || "Aptos Collection";

                await processNFTs(allTokens);

            } catch (error) {
                console.error("Initialization error:", error);
            }
        }

        async function processNFTs(tokens) {
            const total = tokens.length;
            const batchSize = 15;

            for (let i = 0; i < total; i += batchSize) {
                const batch = tokens.slice(i, i + batchSize);
                const resolved = await Promise.all(batch.map(t => resolveMetadata(t)));
                
                resolved.forEach(nft => state.loadedNFTs.push(nft));
                elements.statLoadedNFTs.textContent = state.loadedNFTs.length.toLocaleString();

                updateStatus("Loading Metadata", `Processed ${state.loadedNFTs.length} / ${total}`, state.loadedNFTs.length, total);
                
                if (i === 0 || i % (batchSize * 3) === 0 || state.loadedNFTs.length === total) {
                    applySearchAndFilters();
                }
            }

            updateStatus("Complete", `All ${total} NFTs imported successfully`, total, total);
        }

        async function resolveMetadata(token) {
            let metadata = {
                id: token.token_data_id,
                name: token.token_name || 'NFT',
                description: token.description || '',
                image: '',
                attributes: [],
                rawJson: {}
            };

            if (token.token_uri) {
                const json = await fetchJSON(resolveURI(token.token_uri));
                if (json) {
                    metadata.rawJson = json;
                    metadata.name = json.name || metadata.name;
                    metadata.description = json.description || metadata.description;
                    metadata.image = resolveURI(json.image || json.image_url || '');
                    metadata.attributes = json.attributes || json.traits || [];
                }
            }
            return metadata;
        }

        function applySearchAndFilters() {
            state.filteredNFTs = state.loadedNFTs.filter(nft => {
                if (!state.searchQuery) return true;
                return nft.name.toLowerCase().includes(state.searchQuery);
            });

            state.renderedCount = 0;
            elements.galleryGrid.innerHTML = '';
            renderNextBatch();
        }

        function renderNextBatch() {
            const nextBatch = state.filteredNFTs.slice(state.renderedCount, state.renderedCount + state.pageSize);

            nextBatch.forEach((nft) => {
                const card = createNFTCard(nft);
                elements.galleryGrid.appendChild(card);
            });

            state.renderedCount += nextBatch.length;
            updateSerialNumbers();

            if (state.renderedCount < state.filteredNFTs.length) {
                elements.loadMoreContainer.style.display = 'flex';
            } else {
                elements.loadMoreContainer.style.display = 'none';
            }
        }

        function createNFTCard(nft) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            card.dataset.id = nft.id;

            const serial = document.createElement('div');
            serial.className = 'serial-tag';
            serial.textContent = '#--';

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '&times;';
            delBtn.title = "Delete NFT";
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteNFT(nft.id);
            };

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'nft-image-wrapper';
            imgWrapper.onclick = () => openModal(nft);

            if (nft.image) {
                const img = document.createElement('img');
                img.className = 'nft-image';
                img.src = nft.image;
                img.loading = 'lazy';
                imgWrapper.appendChild(img);
            }

            const info = document.createElement('div');
            info.className = 'nft-info';
            info.onclick = () => openModal(nft);
            info.innerHTML = `<div class="nft-name">${nft.name}</div>`;

            card.appendChild(serial);
            card.appendChild(delBtn);
            card.appendChild(imgWrapper);
            card.appendChild(info);

            return card;
        }

        function deleteNFT(id) {
            state.loadedNFTs = state.loadedNFTs.filter(n => n.id !== id);
            state.filteredNFTs = state.filteredNFTs.filter(n => n.id !== id);
            
            const card = document.querySelector(`.nft-card[data-id="${id}"]`);
            if (card) card.remove();

            elements.statLoadedNFTs.textContent = state.loadedNFTs.length.toLocaleString();
            updateSerialNumbers();
        }

        function updateSerialNumbers() {
            const cards = elements.galleryGrid.querySelectorAll('.nft-card');
            cards.forEach((card, idx) => {
                const tag = card.querySelector('.serial-tag');
                if (tag) tag.textContent = `#${idx + 1}`;
            });
        }

        function openModal(nft) {
            elements.modalMedia.src = nft.image || '';
            elements.modalNFTName.textContent = nft.name;
            elements.modalNFTDescription.textContent = nft.description;
            
            elements.modalTraitsGrid.innerHTML = '';
            if (Array.isArray(nft.attributes)) {
                nft.attributes.forEach(a => {
                    elements.modalTraitsGrid.innerHTML += `
                        <div class="trait-card">
                            <div class="trait-type">${a.trait_type || 'Trait'}</div>
                            <div class="trait-value">${a.value}</div>
                        </div>
                    `;
                });
            }
            elements.nftModal.classList.add('open');
        }

        function closeModal() { elements.nftModal.classList.remove('open'); }

        function updateStatus(label, text, current, total) {
            elements.statusState.textContent = label;
            elements.statusText.textContent = text;
            elements.statusCount.textContent = `${current} / ${total}`;
            elements.progressFill.style.width = `${total ? (current/total)*100 : 0}%`;
            if (label === 'Complete') setTimeout(() => elements.statusContainer.style.display = 'none', 3000);
            else elements.statusContainer.style.display = 'block';
        }

        // Sequential Zip Generation matching Serial numbers Exactly
        async function downloadCollectionZip() {
            if (state.loadedNFTs.length === 0) return alert("No active NFTs to download!");

            const zip = new JSZip();
            const imagesFolder = zip.folder("images");
            const jsonFolder = zip.folder("json");

            elements.downloadZipBtn.disabled = true;
            elements.statusContainer.style.display = 'block';

            const activeList = state.filteredNFTs;
            const total = activeList.length;

            for (let i = 0; i < total; i++) {
                const nft = activeList[i];
                const serialNum = i + 1; // 1, 2, 3...

                // Construct formatted metadata matching the filename
                const jsonContent = {
                    name: nft.name,
                    description: nft.description,
                    image: `${serialNum}.png`,
                    attributes: nft.attributes
                };

                jsonFolder.file(`${serialNum}.json`, JSON.stringify(jsonContent, null, 2));

                if (nft.image) {
                    try {
                        const imgRes = await fetch(nft.image);
                        if (imgRes.ok) {
                            const blob = await imgRes.blob();
                            imagesFolder.file(`${serialNum}.png`, blob);
                        }
                    } catch (e) {
                        console.warn(`Could not download image #${serialNum}`, e);
                    }
                }

                updateStatus("Zipping", `Compressing NFT #${serialNum}...`, serialNum, total);
            }

            zip.generateAsync({ type: "blob" }).then(content => {
                saveAs(content, "aptos_nfts_collection.zip");
                updateStatus("Complete", "Download started!", total, total);
                elements.downloadZipBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
