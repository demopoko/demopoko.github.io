<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptos NFT Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.min.js"></script>
    <style>
        .nft-card { transition: transform 0.2s, box-shadow 0.2s; }
        .nft-card:hover { transform: translateY(-4px); }
        .loader { border-top-color: #3B82F6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-teal-500/20 border border-teal-500/40 flex items-center justify-center font-bold text-teal-400">A</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                        Aptos NFT Explorer
                    </h1>
                    <p class="text-xs text-slate-400">Full Collection Batch Importer</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 text-xs">
                <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                    <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                    <span class="text-slate-300">Aptos Mainnet</span>
                </div>
                <div id="statusBadge" class="hidden sm:flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                    <span id="statusIndicator" class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span id="statusText" class="text-slate-300">Ready</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-6">

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Collection Name</p>
                <h2 id="statCollectionName" class="text-xl font-bold text-slate-100 truncate">Loading...</h2>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Total NFTs Discovered</p>
                <h2 id="statTotalNFTs" class="text-xl font-bold text-slate-100">0</h2>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Active / Loaded NFTs</p>
                <h2 id="statLoadedNFTs" class="text-xl font-bold text-teal-400">0</h2>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 bg-slate-800/30 border border-slate-800 p-3 rounded-xl">
            <div class="relative flex-1 max-w-md">
                <input type="text" id="searchInput" placeholder="Search by name, ID or traits..." 
                       class="w-full bg-slate-900 border border-slate-700/60 rounded-lg px-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-teal-500">
            </div>
            <div class="flex items-center gap-3">
                <button id="downloadZipBtn" disabled class="w-full sm:w-auto bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Download All (ZIP)
                </button>
            </div>
        </div>

        <!-- Progress Bar (Hidden by default) -->
        <div id="progressContainer" class="bg-slate-800/80 border border-slate-700/50 rounded-xl p-4 flex flex-col gap-2">
            <div class="flex justify-between text-xs text-slate-300">
                <span id="progressStep">Initializing...</span>
                <span id="progressCount">0 / 0</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden">
                <div id="progressBar" class="bg-teal-400 h-full w-0 transition-all duration-200"></div>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="nftGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Cards will be populated dynamically -->
        </div>

        <!-- Empty / Error States -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center text-slate-500">
            <svg class="w-12 h-12 mb-3 stroke-slate-600" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <p class="text-base font-medium text-slate-400">No NFTs found</p>
            <p class="text-xs mt-1">Try adjusting your search filter.</p>
        </div>

    </main>

    <!-- Application Script -->
    <script>
        const COLLECTION_ADDRESS = "0xe15065a3ca6334511ef56947edbd6a00481283d8b2d7162d29402517aa26e946";
        const INDEXER_URL = "https://indexer.mainnet.aptoslabs.com/v1/graphql";

        let allNFTs = [];
        let filteredNFTs = [];

        const elements = {
            statCollectionName: document.getElementById('statCollectionName'),
            statTotalNFTs: document.getElementById('statTotalNFTs'),
            statLoadedNFTs: document.getElementById('statLoadedNFTs'),
            nftGrid: document.getElementById('nftGrid'),
            searchInput: document.getElementById('searchInput'),
            downloadZipBtn: document.getElementById('downloadZipBtn'),
            progressContainer: document.getElementById('progressContainer'),
            progressStep: document.getElementById('progressStep'),
            progressCount: document.getElementById('progressCount'),
            progressBar: document.getElementById('progressBar'),
            statusText: document.getElementById('statusText'),
            statusIndicator: document.getElementById('statusIndicator'),
            emptyState: document.getElementById('emptyState')
        };

        function resolveIPFS(url) {
            if (!url) return '';
            if (url.startsWith('ipfs://')) {
                return url.replace('ipfs://', 'https://ipfs.io/ipfs/');
            }
            return url;
        }

        function updateStatus(text, stepMessage, current, total) {
            elements.statusText.textContent = text;
            elements.progressStep.textContent = stepMessage;
            if (total > 0) {
                const percent = Math.min(Math.round((current / total) * 100), 100);
                elements.progressBar.style.width = `${percent}%`;
                elements.progressCount.textContent = `${current} / ${total} (${percent}%)`;
            }
        }

        // Updated API call to load all 7,000+ NFTs without stopping at 100
        async function initializeExplorer() {
            try {
                let fetchedTokens = [];
                let hasMore = true;
                let offset = 0;
                const fetchLimit = 1000; // Increased batch size

                const query = `
                    query GetCollectionTokens($collection_id: String!, $limit: Int!, $offset: Int!) {
                        current_token_datas_v2(
                            where: { collection_id: { _eq: $collection_id } },
                            limit: $limit,
                            offset: $offset
                        ) {
                            token_data_id
                            token_name
                            token_uri
                            description
                            current_collection {
                                collection_name
                                creator_address
                            }
                        }
                    }
                `;

                elements.progressContainer.classList.remove('hidden');

                // Loop until all NFTs are fetched
                while (hasMore) {
                    updateStatus("Discovering", `Fetching NFT collection data...`, fetchedTokens.length, 7000);

                    const res = await fetch(INDEXER_URL, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'x-aptos-client': 'aptos-explorer'
                        },
                        body: JSON.stringify({
                            query,
                            variables: {
                                collection_id: COLLECTION_ADDRESS,
                                limit: fetchLimit,
                                offset: offset
                            }
                        })
                    }).then(r => r.json());

                    const tokens = res.data?.current_token_datas_v2 || [];
                    fetchedTokens = fetchedTokens.concat(tokens);

                    if (tokens.length < fetchLimit) {
                        hasMore = false;
                    } else {
                        offset += fetchLimit;
                    }
                }

                elements.statTotalNFTs.textContent = fetchedTokens.length.toLocaleString();
                if (fetchedTokens.length > 0) {
                    elements.statCollectionName.textContent = fetchedTokens[0].current_collection?.collection_name || "HyperNova Squad";
                }

                await processNFTs(fetchedTokens);

            } catch (error) {
                console.error("Initialization error:", error);
                elements.statusText.textContent = "Error Loading";
                elements.statusIndicator.className = "w-2 h-2 rounded-full bg-red-500";
            }
        }

        async function processNFTs(tokens) {
            allNFTs = tokens.map((token, index) => {
                let imageUrl = resolveIPFS(token.token_uri);
                return {
                    id: token.token_data_id,
                    name: token.token_name || `NFT #${index + 1}`,
                    image: imageUrl,
                    index: index + 1
                };
            });

            filteredNFTs = [...allNFTs];
            elements.statLoadedNFTs.textContent = filteredNFTs.length.toLocaleString();
            elements.progressContainer.classList.add('hidden');
            elements.downloadZipBtn.disabled = false;
            elements.statusText.textContent = "Completed";
            elements.statusIndicator.className = "w-2 h-2 rounded-full bg-teal-400";

            renderGrid();
        }

        function renderGrid() {
            elements.nftGrid.innerHTML = '';

            if (filteredNFTs.length === 0) {
                elements.emptyState.classList.remove('hidden');
                elements.emptyState.classList.add('flex');
                return;
            }

            elements.emptyState.classList.add('hidden');
            elements.emptyState.classList.remove('flex');

            // Render visible cards
            const limitToRender = Math.min(filteredNFTs.length, 300); // Render first 300 for performance
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < limitToRender; i++) {
                const nft = filteredNFTs[i];
                const card = document.createElement('div');
                card.className = "nft-card bg-slate-800/40 border border-slate-800 hover:border-slate-700 rounded-xl overflow-hidden p-2 flex flex-col gap-2 relative group";
                
                card.innerHTML = `
                    <div class="relative aspect-square w-full rounded-lg bg-slate-900 overflow-hidden">
                        <span class="absolute top-1.5 left-1.5 bg-slate-950/80 backdrop-blur text-teal-400 text-[10px] font-bold px-1.5 py-0.5 rounded border border-teal-500/30 z-10">
                            #${nft.index}
                        </span>
                        <img src="${nft.image}" alt="${nft.name}" loading="lazy" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200?text=Image+Error';">
                    </div>
                    <div class="px-1 pb-1">
                        <p class="text-xs font-semibold text-slate-200 truncate">${nft.name}</p>
                    </div>
                `;
                fragment.appendChild(card);
            }

            elements.nftGrid.appendChild(fragment);
        }

        // Search Filter
        elements.searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                filteredNFTs = [...allNFTs];
            } else {
                filteredNFTs = allNFTs.filter(nft => nft.name.toLowerCase().includes(query));
            }
            elements.statLoadedNFTs.textContent = filteredNFTs.length.toLocaleString();
            renderGrid();
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', initializeExplorer);
    </script>
</body>
</html>
