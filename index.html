<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Etherscan Source Code Downloader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 10px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #4CAF50; }
    label { font-size: 14px; margin-top: 10px; display: block; text-align: left; color: #bbb; }
    input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; background: #2a2a2a; border: 1px solid #444; border-radius: 5px; color: #fff; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #4CAF50; border: none; border-radius: 5px; color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    #status { margin-top: 15px; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>

<div class="card">
  <h2>Smart Contract Downloader</h2>
  <label for="apiKey">Etherscan API Key:</label>
  <input type="text" id="apiKey" placeholder="Your Etherscan API Key">

  <label for="contractAddress">Contract Address:</label>
  <input type="text" id="contractAddress" placeholder="0x...">

  <button onclick="downloadSourceCode()">Download ZIP</button>

  <div id="status"></div>
</div>

<script>
async function downloadSourceCode() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const address = document.getElementById('contractAddress').value.trim();
  const status = document.getElementById('status');

  if (!apiKey || !address) {
    status.style.color = 'red';
    status.innerText = 'অনুগ্রহ করে API Key এবং Contract Address দুটোই দিন।';
    return;
  }

  status.style.color = '#ff9800';
  status.innerText = 'Etherscan থেকে ডেটা ফেচ করা হচ্ছে...';

  try {
    const url = `https://api.etherscan.io/api?module=contract&action=getsourcecode&address=${address}&apikey=${apiKey}`;
    const response = await fetch(url);
    const data = await response.json();

    if (data.status !== "1" || !data.result || !data.result[0].SourceCode) {
      status.style.color = 'red';
      status.innerText = 'ত্রুটি: সোর্স কোড পাওয়া যায়নি বা API Key ভুল।';
      return;
    }

    const rawSource = data.result[0].SourceCode;
    const contractName = data.result[0].ContractName || "Contract";
    const zip = new JSZip();

    // Standard JSON-Input Check (যেমন স্ক্রিনশটের argonauts.sol)
    if (rawSource.startsWith('{{') && rawSource.endsWith('}}')) {
      const parsedJson = JSON.parse(rawSource.slice(1, -1));
      const sources = parsedJson.sources;

      for (const [filePath, fileContent] of Object.entries(sources)) {
        zip.file(filePath, fileContent.content);
      }
    } else if (rawSource.startsWith('{') && rawSource.endsWith('}')) {
      const parsedJson = JSON.parse(rawSource);
      const sources = parsedJson.sources || parsedJson;

      for (const [filePath, fileContent] of Object.entries(sources)) {
        zip.file(filePath, fileContent.content || fileContent);
      }
    } else {
      // সিঙ্গেল ফাইল হলে
      zip.file(`${contractName}.sol`, rawSource);
    }

    status.innerText = 'ZIP ফাইল তৈরি করা হচ্ছে...';
    
    const blob = await zip.generateAsync({ type: "blob" });
    const downloadUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = downloadUrl;
    a.download = `${contractName}_SourceCode.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    status.style.color = '#4CAF50';
    status.innerText = 'ডাউনলোড সম্পন্ন হয়েছে!';

  } catch (err) {
    status.style.color = 'red';
    status.innerText = 'ত্রুটি: ' + err.message;
  }
}
</script>

</body>
</html>
