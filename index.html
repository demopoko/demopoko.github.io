<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NFT Metadata Downloader</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip and FileSaver CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-6">

  <div class="max-w-2xl w-full bg-gray-800 rounded-2xl shadow-xl border border-gray-700 p-8 mt-10">
    <h1 class="text-2xl font-bold text-indigo-400 mb-2 text-center">NFT Metadata Downloader</h1>
    <p class="text-sm text-gray-400 text-center mb-6">Alchemy API ব্যবহার করে ফুল কালেকশনের `.json` ফাইল জিপ করুন</p>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Contract Address</label>
        <input 
          id="contractInput" 
          type="text" 
          value="0x387c41b0b2f1128de44db1bcf8baad085f26392c" 
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 font-mono"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Alchemy API Key</label>
        <input 
          id="apiKeyInput" 
          type="text" 
          value="-De1p3ZGJsjA0c2Bsih3t" 
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 font-mono"
        />
      </div>

      <button 
        id="startBtn" 
        onclick="startDownload()" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/30 flex justify-center items-center gap-2"
      >
        মেটাডেটা ফেচ ও জিপ ডাউনলোড শুরু করুন
      </button>
    </div>

    <!-- Status Section -->
    <div id="statusContainer" class="mt-8 hidden space-y-3">
      <div class="flex justify-between text-sm text-gray-300 font-mono">
        <span id="statusText">ডেটা লোড হচ্ছে...</span>
        <span id="countText">0 / 0</span>
      </div>
      
      <div class="w-full bg-gray-900 rounded-full h-3 overflow-hidden border border-gray-700">
        <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-150"></div>
      </div>

      <div id="logBox" class="w-full bg-gray-950 rounded-lg p-3 text-xs font-mono text-gray-400 h-32 overflow-y-auto border border-gray-800">
        <div>রেডি...</div>
      </div>
    </div>
  </div>

  <script>
    async function startDownload() {
      const contractAddress = document.getElementById('contractInput').value.trim();
      const apiKey = document.getElementById('apiKeyInput').value.trim();

      if (!contractAddress || !apiKey) {
        alert("কন্ট্রাক্ট এড্রেস এবং API Key সঠিকভাবে দিন!");
        return;
      }

      const startBtn = document.getElementById('startBtn');
      const statusContainer = document.getElementById('statusContainer');
      const statusText = document.getElementById('statusText');
      const countText = document.getElementById('countText');
      const progressBar = document.getElementById('progressBar');
      const logBox = document.getElementById('logBox');

      startBtn.disabled = true;
      startBtn.classList.add('opacity-50', 'cursor-not-allowed');
      statusContainer.classList.remove('hidden');
      logBox.innerHTML = '';

      function log(msg) {
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
      }

      const zip = new JSZip();
      let pageKey = null;
      let totalFetched = 0;
      let hasMore = true;

      log("Alchemy API এর সাথে কানেক্ট করা হচ্ছে...");

      try {
        while (hasMore) {
          let url = `https://eth-mainnet.g.alchemy.com/nft/v3/${apiKey}/getNFTsForContract?contractAddress=${contractAddress}&withMetadata=true`;
          if (pageKey) {
            url += `&pageKey=${pageKey}`;
          }

          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP Error! Status: ${response.status}`);
          }

          const data = await response.json();
          const nfts = data.nfts || [];

          if (nfts.length === 0) {
            hasMore = false;
            break;
          }

          for (const nft of nfts) {
            totalFetched++;
            
            // টোকেন আইডি অনুযায়ী ফাইলের নাম (যেমন: 1.json, 2.json)
            const tokenId = nft.tokenId ? parseInt(nft.tokenId, 10) : totalFetched;
            const fileName = `${tokenId}.json`;

            // আসল/র (Raw) মেটাডেটা এক্সট্র্যাক্ট করা
            const metadata = nft.raw?.metadata || nft.metadata || nft;

            // জিপ ফাইলে যুক্ত করা
            zip.file(fileName, JSON.stringify(metadata, null, 2));

            countText.textContent = `ফাইল সংগ্রহ করা হয়েছে: ${totalFetched}`;
            statusText.textContent = `মেটাডেটা লোড হচ্ছে... (${fileName})`;
          }

          log(`${nfts.length} টি মেটাডেটা প্রসেস করা হয়েছে...`);

          if (data.pageKey) {
            pageKey = data.pageKey;
          } else {
            hasMore = false;
          }
        }

        if (totalFetched === 0) {
          log("কোনো মেটাডেটা পাওয়া যায়নি!");
          startBtn.disabled = false;
          startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          return;
        }

        log("ZIP ফাইল জেনারেট করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...");
        statusText.textContent = "ZIP তৈরি হচ্ছে...";
        progressBar.style.width = "90%";

        const zipBlob = await zip.generateAsync({ type: "blob" }, (metadata) => {
          progressBar.style.width = `${Math.round(metadata.percent)}%`;
        });

        log("ডাউনলোড শুরু হচ্ছে!");
        saveAs(zipBlob, `${contractAddress}_metadata.zip`);
        statusText.textContent = "ডাউনলোড সম্পন্ন!";
        progressBar.style.width = "100%";

      } catch (error) {
        console.error(error);
        log(`এরর: ${error.message}`);
        statusText.textContent = "ব্যর্থ হয়েছে!";
      } finally {
        startBtn.disabled = false;
        startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }
  </script>
</body>
</html>
