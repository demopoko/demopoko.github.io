<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argonauts Onchain SVG Layer Extractor</title>
    <!-- Tailwind CSS for clean, modern UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for local ZIP generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- fflate or similar not needed as JSZip is loaded via CDN; also include unzipper / fflate fallback reader via CDN for robust ZIP parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fflate/0.8.2/fflate.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">
    <div class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8">
        <header class="mb-8 border-b border-slate-800 pb-5">
            <h1 class="text-3xl font-extrabold tracking-tight text-amber-400">Argonauts Onchain Layer Extractor</h1>
            <p class="text-slate-400 mt-2 text-sm">
                Upload the original Renderer source ZIP. The app reads the deployed renderer's SSTORE2 data from Ethereum Mainnet and extracts the individual SVG layers.
            </p>
        </header>

        <div class="space-y-6">
            <!-- File Upload -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Renderer Source ZIP</label>
                <div class="flex items-center gap-4">
                    <label class="cursor-pointer bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 px-5 rounded-xl transition duration-200 shadow-md">
                        <span>Choose ZIP</span>
                        <input type="file" id="zipFile" accept=".zip" class="hidden" />
                    </label>
                    <span id="fileInfo" class="text-sm text-slate-400 italic">No file chosen</span>
                </div>
            </div>

            <!-- RPC URL -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Ethereum Mainnet RPC</label>
                <input type="text" id="rpcUrl" value="https://ethereum-rpc.publicnode.com" 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-amber-500 font-mono text-sm" />
            </div>

            <!-- Renderer Contract -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">Renderer Contract</label>
                <input type="text" id="rendererAddress" value="0x7F277A7d5E0bE5d5AB655c01262fc8d1698f8597" readonly
                    class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-400 font-mono text-sm select-all" />
            </div>

            <!-- Action Button -->
            <button id="extractBtn" disabled
                class="w-full bg-amber-500/50 cursor-not-allowed hover:bg-amber-500 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg text-lg">
                Extract SVG Layers
            </button>
        </div>

        <!-- Progress Section -->
        <div id="progressSection" class="mt-8 hidden">
            <h3 class="text-sm font-semibold text-slate-300 mb-3 uppercase tracking-wider">Extraction Progress</h3>
            <div id="logBox" class="bg-slate-950 border border-slate-800 rounded-xl p-4 h-48 overflow-y-auto font-mono text-xs text-slate-300 space-y-1"></div>
        </div>

        <!-- Download Section -->
        <div id="downloadSection" class="mt-6 hidden">
            <a id="downloadBtn" href="#" download="NFT_Layers.zip"
                class="block text-center bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg text-lg">
                Download NFT_Layers.zip
            </a>
        </div>
    </div>

    <script>
        const LAYER_LABELS = ['Palette', 'Bones', 'Cloak', 'Relic', 'Sight', 'Artifact', 'Crown'];
        
        // Exact trait tables from TraitDefs.sol
        const TRAIT_TABLES = {
            0: [
                "Bubblegum", "Yellow", "Violet", "Wine", "Sky", "Void", "MuseGreen", "Ancient",
                "Punkblue", "Blush", "Offwhite", "Hot Rose", "Emerald", "Bright Lilac", "Neon Mint", "Paper White",
                "Radioactive Void Charcoal", "Radioactive Deep Raspberry", "Radioactive Seafoam", "Radioactive Lavender", "Radioactive Paper White",
                "Ice Prism Pink", "Violet Pink", "Violet Cyan", "Navy Pink", "Void Pink",
                "Void Blue", "Void Cyan", "Navy Blue Vignette", "Void Teal Vignette",
                "Siren", "Seafoam", "Lavender", "Storm"
            ],
            1: ["Alien", "Radioactive", "Gold", "Petrified", "Floral", "Coral", "Silver", "Prehistoric", "Bone", "Floral"],
            2: ["", "Servant", "Death", "Royalty", "Ivory", "Clergy"],
            3: ["", "Gold"],
            4: ["", "Shades", "Glasses", "Digital", "Eye Patch", "3D Glasses", "Designer", "Gucci", "Louis Vuitton", "Prada", "Versace", "Dior", "Balenciaga", "Chanel", "Eye Patch"],
            5: ["", "Woodpipe", "THC Vape"],
            6: ["", "Oarsman's Band", "Bandana", "Dawn Pink Beanie", "Aegean Blue Beanie", "Purphat", "Golden Fleece", "Corsair"]
        };

        const zipFileInput = document.getElementById('zipFile');
        const fileInfo = document.getElementById('fileInfo');
        const extractBtn = document.getElementById('extractBtn');
        const rpcUrlInput = document.getElementById('rpcUrl');
        const progressSection = document.getElementById('progressSection');
        const logBox = document.getElementById('logBox');
        const downloadSection = document.getElementById('downloadSection');
        const downloadBtn = document.getElementById('downloadBtn');

        let uploadedZipData = null;

        zipFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            fileInfo.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            try {
                const buffer = await file.arrayBuffer();
                uploadedZipData = buffer;
                extractBtn.disabled = false;
                extractBtn.classList.remove('bg-amber-500/50', 'cursor-not-allowed');
                extractBtn.classList.add('bg-amber-500', 'hover:bg-amber-600', 'cursor-pointer');
            } catch (err) {
                alert("Failed to read ZIP file: " + err.message);
            }
        });

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            if (type === 'error') div.className = 'text-rose-400 font-bold';
            if (type === 'success') div.className = 'text-emerald-400 font-bold';
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function rpcCall(url, method, params) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
            return data.result;
        }

        function hexToBytes(hex) {
            if (hex.startsWith('0x')) hex = hex.slice(2);
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
            }
            return bytes;
        }

        // Function selectors
        // blobCount() -> 0x8a923d8e
        // blobs(uint256) -> 0x12d3dbbe
        // layout() -> 0x9b35b6a7

        extractBtn.addEventListener('click', async () => {
            progressSection.classList.remove('hidden');
            downloadSection.classList.add('hidden');
            logBox.innerHTML = '';
            extractBtn.disabled = true;

            try {
                log("Reading Renderer.sol, SSTORE2.sol, and TraitDefs.sol from ZIP...");
                const unzipped = fflate.unzipSync(new Uint8Array(uploadedZipData));
                
                let foundRenderer = false, foundSstore2 = false, foundTraitDefs = false;
                for (const filename of Object.keys(unzipped)) {
                    if (filename.endsWith('Renderer.sol')) foundRenderer = true;
                    if (filename.endsWith('SSTORE2.sol')) foundSstore2 = true;
                    if (filename.endsWith('TraitDefs.sol')) foundTraitDefs = true;
                }

                if (!foundRenderer || !foundSstore2 || !foundTraitDefs) {
                    throw new Error("Missing required source files (Renderer.sol, SSTORE2.sol, or TraitDefs.sol) in ZIP.");
                }
                log("Source files validated successfully.", "success");

                const rpcUrl = rpcUrlInput.value.trim();
                const rendererAddr = document.getElementById('rendererAddress').value.trim();

                log("Connecting to Ethereum Mainnet...");
                const chainIdHex = await rpcCall(rpcUrl, 'eth_chainId', []);
                const chainId = parseInt(chainIdHex, 16);
                log(`Connected to Chain ID: ${chainId}`);
                if (chainId !== 1) {
                    throw new Error("RPC is not Ethereum Mainnet (Chain ID is not 1).");
                }

                log("Checking Renderer contract bytecode...");
                const code = await rpcCall(rpcUrl, 'eth_getCode', [rendererAddr, 'latest']);
                if (!code || code === '0x' || code === '0x0') {
                    throw new Error("Renderer contract has no bytecode on Ethereum Mainnet.");
                }

                log("Reading blobCount()...");
                const blobCountHex = await rpcCall(rpcUrl, 'eth_call', [{
                    to: rendererAddr,
                    data: '0x8a923d8e'
                }, 'latest']);
                const blobCount = parseInt(blobCountHex, 16);
                log(`Total blobs found: ${blobCount}`, "success");

                log("Reading layout()...");
                const layoutHex = await rpcCall(rpcUrl, 'eth_call', [{
                    to: rendererAddr,
                    data: '0x9b35b6a7'
                }, 'latest']);
                
                // Decode ABI encoded bytes
                const layoutBytesFull = hexToBytes(layoutHex);
                // ABI encoded bytes start with offset (32 bytes), length (32 bytes), then data
                const layoutLen = parseInt(layoutHex.substr(66, 64), 16);
                const layoutDataHex = layoutHex.substr(130, layoutLen * 2);
                const layoutBytes = hexToBytes(layoutDataHex);
                log(`Layout decoded successfully (${layoutBytes.length} bytes).`);

                log("Reading blob pointers...");
                const blobAddresses = [];
                for (let i = 0; i < blobCount; i++) {
                    // blobs(uint256) selector: 0x12d3dbbe with padded uint256 index
                    const paddedIdx = i.toString(16).padStart(64, '0');
                    const res = await rpcCall(rpcUrl, 'eth_call', [{
                        to: rendererAddr,
                        data: '0x12d3dbbe' + paddedIdx
                    }, 'latest']);
                    // address is last 20 bytes (40 hex chars) of result
                    const addr = '0x' + res.slice(-40);
                    blobAddresses.push(addr);
                }
                log(`Retrieved ${blobAddresses.length} SSTORE2 blob pointers.`);

                // Read and cache blob runtime bytecodes (SSTORE2 decoding: strip 1 byte STOP prefix 0x00)
                log("Fetching SSTORE2 blob bytecodes...");
                const decodedBlobs = {};
                for (let i = 0; i < blobAddresses.length; i++) {
                    const ptr = blobAddresses[i];
                    const runtimeCode = await rpcCall(rpcUrl, 'eth_getCode', [ptr, 'latest']);
                    if (!runtimeCode || runtimeCode === '0x' || runtimeCode === '0x0') {
                        throw new Error(`Invalid SSTORE2 pointer at index ${i}: ${ptr}`);
                    }
                    const runtimeBytes = hexToBytes(runtimeCode);
                    // SSTORE2.sol: codeSize = pointer.code.length - 1; read skips 1 byte STOP prefix.
                    // runtimeBytes[0] is 0x00 STOP, data follows at index 1.
                    const blobData = runtimeBytes.slice(1);
                    decodedBlobs[i] = blobData;
                }
                log("All SSTORE2 blobs decoded successfully.", "success");

                // Parse layout per layer
                // layout format: per layer: [count 1B][blob id 1B per table index]; 0xFF = none
                let pos = 0;
                const layerTraitBlobIds = {};

                for (let layer = 0; layer < 7; layer++) {
                    if (pos >= layoutBytes.length) break;
                    const count = layoutBytes[pos];
                    pos += 1;
                    const blobIds = [];
                    for (let idx = 0; idx < count; idx++) {
                        if (pos >= layoutBytes.length) throw new Error("Invalid layout format");
                        blobIds.push(layoutBytes[pos]);
                        pos += 1;
                    }
                    layerTraitBlobIds[layer] = blobIds;
                }

                // Helper for opacity formatting matching _opacity() in Renderer.sol
                function formatOpacity(a) {
                    if (a === 255) return '"/>';
                    const m = Math.floor((a * 1000) / 255);
                    let d = m.toString();
                    while (d.length < 3) d = '0' + d;
                    return `" fill-opacity="0.${d}"/>`;
                }

                // Helper for hex color matching _hex()
                function formatHex(r, g, b) {
                    const sym = "0123456789abcdef";
                    return sym[r >> 4] + sym[r & 15] +
                           sym[g >> 4] + sym[g & 15] +
                           sym[b >> 4] + sym[b & 15];
                }

                // Decoder reproducing _rects()
                function decodeBlobToRects(blob) {
                    const p = (blob[0] << 8) | blob[1];
                    let off = 2 + p * 4;
                    let pixel = 0;
                    let rectsOut = '';

                    while (off < blob.length) {
                        const ci = (blob[off] << 8) | blob[off + 1];
                        const run = blob[off + 2];

                        if (ci !== 0) {
                            const e = 2 + (ci - 1) * 4;
                            const x = pixel % 24;
                            const y = Math.floor(pixel / 24);
                            const fillColor = formatHex(blob[e], blob[e+1], blob[e+2]);
                            const opacityStr = formatOpacity(blob[e+3]);

                            rectsOut += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="#${fillColor}${opacityStr}`;
                        }
                        pixel += run;
                        off += 3;
                    }
                    return rectsOut;
                }

                log("Generating individual layer SVGs...");
                const zip = new JSZip();
                const manifestLayers = [];

                for (let layer = 0; layer < 7; layer++) {
                    const layerName = LAYER_LABELS[layer];
                    const blobIds = layerTraitBlobIds[layer] || [];
                    const traitNames = TRAIT_TABLES[layer] || [];
                    const layerFolder = zip.folder(layerName);
                    
                    const layerManifestEntries = [];

                    for (let idx = 0; idx < blobIds.length; idx++) {
                        const blobId = blobIds[idx];
                        const traitName = traitNames[idx] !== undefined ? traitNames[idx] : `Trait_${idx}`;
                        const sanitizedName = traitName.replace(/[^a-zA-Z0-9-_]/g, '_');
                        const fileName = `${idx.toString().padStart(2, '0')}_${sanitizedName || 'None'}.svg`;

                        if (blobId === 0xFF) {
                            log(`[${layerName}] Trait ${idx} (${traitName}): 0xFF (none), skipping.`);
                            layerManifestEntries.push({ index: idx, trait: traitName, blobId: null, svgFile: null });
                            continue;
                        }

                        if (blobId >= blobCount) {
                            throw new Error(`Layout references blob ID ${blobId} which is outside blobCount (${blobCount})`);
                        }

                        const blobBytes = decodedBlobs[blobId];
                        if (!blobBytes) {
                            throw new Error(`Missing blob data for blob ID ${blobId}`);
                        }

                        const rects = decodeBlobToRects(blobBytes);
                        const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">${rects}</svg>`;

                        layerFolder.file(fileName, svgContent);
                        layerManifestEntries.push({ index: idx, trait: traitName, blobId: blobId, svgFile: `${layerName}/${fileName}` });
                        log(`Generated ${layerName}/${fileName} (Blob #${blobId})`);
                    }

                    manifestLayers.push({
                        layerIndex: layer,
                        layerLabel: layerName,
                        traits: layerManifestEntries
                    });
                }

                // Create manifest.json
                const manifest = {
                    network: "Ethereum Mainnet",
                    chainId: 1,
                    renderer: rendererAddr,
                    collection: "0x387c41b0b2f1128de44db1bcf8baad085f26392c",
                    blobCount: blobCount,
                    layers: manifestLayers
                };

                zip.file("manifest.json", JSON.stringify(manifest, null, 2));

                log("Creating NFT_Layers.zip...", "success");
                const content = await zip.generateAsync({ type: "blob" });
                
                const url = URL.createObjectURL(content);
                downloadBtn.href = url;
                downloadSection.classList.remove('hidden');
                log("Done! Ready for download.", "success");

            } catch (err) {
                log("ERROR: " + err.message, "error");
                console.error(err);
            } finally {
                extractBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
