<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVM Source Downloader (V2 API)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; padding: 30px; border-radius: 12px; width: 420px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #2ea44f; font-size: 22px; text-align: center; }
    p.desc { font-size: 13px; color: #8b949e; text-align: center; margin-bottom: 20px; }
    label { font-size: 13px; font-weight: bold; margin-top: 12px; display: block; color: #8b949e; }
    select, input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #58a6ff; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2ea44f; }
    #status { margin-top: 15px; font-size: 13px; line-height: 1.4; word-break: break-word; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h2>EVM Source Downloader</h2>
  <p class="desc">Etherscan V2 API ব্যবহার করে স্মার্ট কন্ট্রাক্ট ZIP আকারে ডাউনলোড করুন</p>
  
  <label for="network">Network</label>
  <select id="network">
    <option value="1">Ethereum Mainnet (Chain ID: 1)</option>
    <option value="42161">Arbitrum One (Chain ID: 42161)</option>
    <option value="8453">Base Mainnet (Chain ID: 8453)</option>
    <option value="137">Polygon Mainnet (Chain ID: 137)</option>
    <option value="10">Optimism Mainnet (Chain ID: 10)</option>
  </select>

  <label for="contractAddress">Contract Address</label>
  <input type="text" id="contractAddress" placeholder="0x387c41b0b2f1128de44db1bcf8baad085f26392c">

  <label for="apiKey">Explorer API Key</label>
  <input type="text" id="apiKey" value="CG6QBZV8HFTUY17BK1EJQC3NPQGF8GZSFK">

  <button onclick="downloadSourceCode()">Fetch Source Code</button>

  <div id="status"></div>
</div>

<script>
async function downloadSourceCode() {
  const chainId = document.getElementById('network').value;
  const address = document.getElementById('contractAddress').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  const status = document.getElementById('status');

  if (!address || !apiKey) {
    status.style.color = '#f85149';
    status.innerText = 'Contract Address এবং API Key দুটোই থাকা প্রয়োজন।';
    return;
  }

  status.style.color = '#d29922';
  status.innerText = 'Etherscan V2 API থেকে সোর্স কোড লোড হচ্ছে...';

  try {
    // Unified Etherscan V2 API Endpoint
    const url = `https://api.etherscan.io/v2/api?chainid=${chainId}&module=contract&action=getsourcecode&address=${address}&apikey=${apiKey}`;
    
    const response = await fetch(url);
    const data = await response.json();

    if (data.status !== "1" || !data.result || !data.result[0] || !data.result[0].SourceCode) {
      status.style.color = '#f85149';
      status.innerText = `এরর: ${typeof data.result === 'string' ? data.result : 'সোর্স কোড পাওয়া যায়নি বা কন্ট্রাক্ট ভেরিফাইড নয়।'}`;
      return;
    }

    let rawSource = data.result[0].SourceCode;
    const contractName = data.result[0].ContractName || "Contract";
    const zip = new JSZip();

    // Parse Etherscan Multi-file / Standard JSON Input Formats
    let isMultiFile = false;
    
    if (rawSource.startsWith('{{') && rawSource.endsWith('}}')) {
      rawSource = rawSource.slice(1, -1);
    }

    try {
      const parsedJson = JSON.parse(rawSource);
      const sources = parsedJson.sources || (parsedJson.language ? null : parsedJson);
      
      if (sources) {
        isMultiFile = true;
        for (const [filePath, fileObj] of Object.entries(sources)) {
          const content = fileObj.content || fileObj;
          if (typeof content === 'string') {
            zip.file(filePath, content);
          }
        }
      }
    } catch (e) {
      // Single-file Solidity source code
      isMultiFile = false;
    }

    if (!isMultiFile) {
      zip.file(`${contractName}.sol`, rawSource);
    }

    status.innerText = 'ZIP ফাইল জেনারেট করা হচ্ছে...';
    
    const blob = await zip.generateAsync({ type: "blob" });
    const downloadUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = downloadUrl;
    a.download = `${contractName}_${address.substring(0, 6)}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    status.style.color = '#3fb950';
    status.innerText = 'ডাউনলোড সফল হয়েছে!';

  } catch (err) {
    status.style.color = '#f85149';
    status.innerText = 'ত্রুটি: ' + err.message;
  }
}
</script>

</body>
</html>
