<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Pixel NFT Generator (10,000 Collection)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 8px; }
        p { color: var(--text-muted); font-size: 0.95rem; }

        .main-container { display: grid; grid-template-columns: 350px 1fr; gap: 30px; width: 100%; max-width: 1100px; }
        .controls-card, .preview-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .control-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input[type="number"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 1rem; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
        .btn-primary { background-color: var(--accent); color: #000; }
        .btn-primary:hover { background-color: #16a34a; transform: translateY(-1px); }
        .btn-secondary { background-color: #3b82f6; color: #fff; }
        .btn-secondary:hover { background-color: #2563eb; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .svg-display { width: 280px; height: 280px; margin: 0 auto 20px auto; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); background: #000; }
        .svg-display svg { width: 100%; height: 100%; display: block; }

        .progress-container { margin-top: 20px; display: none; }
        .progress-bar { width: 100%; height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
        .progress-status { font-size: 0.85rem; color: var(--text-muted); text-align: center; font-family: monospace; }
        .trait-box { background: #0f172a; padding: 12px; border-radius: 6px; font-size: 0.85rem; font-family: monospace; color: var(--accent); margin-top: 10px; line-height: 1.6; }
        .rarity-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.75rem; margin-top: 6px; }

        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>10,000 Premium Generative Pixel NFT Creator</h1>
        <p>বিভিন্ন হেয়ারস্টাইল, চশমা, পোশাক, এক্সেসরিজ ও রেয়ারিটি সহ প্রিমিয়াম কোয়ালিটির অনন্য NFT এক্সপোর্ট করুন</p>
    </header>

    <div class="main-container">
        <div class="controls-card">
            <div class="control-group">
                <label for="nftCount">তৈরি করার পরিমাণ (সর্বোচ্চ ১০,০০০)</label>
                <input type="number" id="nftCount" value="5555" min="1" max="10000">
            </div>

            <button class="btn btn-primary" id="btnPreview" onclick="generateSinglePreview()">র্যান্ডম প্রিভিউ দেখুন</button>
            <button class="btn btn-secondary" id="btnGenerate" onclick="startBatchGeneration()">ZIP ফাইল ডাউনলোড করুন (SVG + JSON)</button>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-status" id="progressStatus">প্রসেসিং হচ্ছে: 0 / 0</div>
            </div>
        </div>

        <div class="preview-card">
            <div class="preview-header">
                <h3>লাইভ আর্ট প্রিভিউ</h3>
                <span id="nftIdText" style="font-weight: 600; color: var(--accent);">#Preview</span>
            </div>

            <div class="svg-display" id="svgPreviewContainer"></div>

            <h4>জেনারেটেড ট্রেইটস (Attributes):</h4>
            <div class="trait-box" id="traitDisplay">--</div>
        </div>
    </div>

        /* =========================================================
           HELPERS
           ========================================================= */
        function getWeightedRandom(items) {
            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (let item of items) {
                if (random < item.weight) return item;
                random -= item.weight;
            }
            return items[0];
        }

        function overallRarity(traitList) {
            let maxIdx = 0;
            traitList.forEach(t => {
                const idx = RARITY_ORDER.indexOf(t.rarity);
                if (idx > maxIdx) maxIdx = idx;
            });
            return RARITY_ORDER[maxIdx];
        }

        function hexToRgb(hex) {
            const h = hex.replace('#', '');
            return {
                r: parseInt(h.substring(0, 2), 16),
                g: parseInt(h.substring(2, 4), 16),
                b: parseInt(h.substring(4, 6), 16)
            };
        }

        function luminance(hex) {
            const { r, g, b } = hexToRgb(hex);
            return 0.299 * r + 0.587 * g + 0.114 * b;
        }

        // Ensures the character clearly pops against the chosen background
        function hasGoodContrast(bgHex, skinHex) {
            return Math.abs(luminance(bgHex) - luminance(skinHex)) > 55;
        }

        function hasTag(obj, tag) {
            return obj && obj.tag && obj.tag.split(" ").includes(tag);
        }

        /* =========================================================
           SVG RENDERING (layered pixel art with lighting)
           ========================================================= */
        function buildSVG(dna) {
            const bg        = TRAITS.backgrounds[dna.bgIndex];
            const skin       = TRAITS.skins[dna.skinIndex];
            const headwear    = TRAITS.headwear[dna.headwearIndex];
            const eyewear     = TRAITS.eyewear[dna.eyewearIndex];
            const mouth       = TRAITS.mouths[dna.mouthIndex];
            const clothing    = TRAITS.clothing[dna.clothingIndex];
            const accessory   = TRAITS.accessories[dna.accessoryIndex];
            const aura        = TRAITS.specialAuras[dna.auraIndex];

            // Background pattern layer
            let bgPatternHtml = "";
            if (bg.type === "pattern_stars") {
                bgPatternHtml = `<rect x="10" y="15" width="4" height="4" fill="${bg.accent}" opacity="0.6"/>
                                 <rect x="80" y="20" width="6" height="6" fill="${bg.accent}" opacity="0.8"/>
                                 <rect x="20" y="75" width="5" height="5" fill="${bg.accent}" opacity="0.5"/>
                                 <rect x="75" y="80" width="4" height="4" fill="${bg.accent}" opacity="0.7"/>
                                 <rect x="8" y="55" width="3" height="3" fill="${bg.accent}" opacity="0.4"/>`;
            } else if (bg.type === "pattern_grid") {
                bgPatternHtml = `<path d="M0 25 H100 M0 50 H100 M0 75 H100 M25 0 V100 M50 0 V100 M75 0 V100" stroke="${bg.accent}" stroke-width="0.75" opacity="0.25"/>`;
            } else if (bg.type === "pattern_glow") {
                bgPatternHtml = `<rect x="20" y="20" width="60" height="60" fill="${bg.accent}" opacity="0.08"/><rect x="30" y="30" width="40" height="40" fill="${bg.accent}" opacity="0.06"/>`;
            } else if (bg.type === "pattern_noise") {
                bgPatternHtml = `<rect x="12" y="18" width="2" height="2" fill="${bg.accent}" opacity="0.5"/><rect x="88" y="22" width="2" height="2" fill="${bg.accent}" opacity="0.5"/><rect x="16" y="82" width="2" height="2" fill="${bg.accent}" opacity="0.5"/><rect x="84" y="78" width="2" height="2" fill="${bg.accent}" opacity="0.5"/><rect x="50" y="90" width="2" height="2" fill="${bg.accent}" opacity="0.4"/>`;
            }

            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1000" height="1000" shape-rendering="crispEdges">
                <!-- Background Layer -->
                <rect width="100" height="100" fill="${bg.mainColor}" />
                <rect x="0" y="80" width="100" height="20" fill="${bg.shadow}" opacity="0.4" />
                ${bgPatternHtml}

                <!-- Special Aura / Legendary Layer -->
                ${aura.draw()}

                <!-- Character Base Silhouette Shadow -->
                <rect x="21" y="23" width="58" height="72" fill="#000000" opacity="0.16" />

                <!-- Head Base Structure -->
                <rect x="26" y="26" width="48" height="42" fill="${skin.base}" />
                <!-- Pixel Lighting: shadows & highlights -->
                <rect x="66" y="26" width="8" height="42" fill="${skin.shadow}" />
                <rect x="26" y="60" width="48" height="8" fill="${skin.shadow}" opacity="0.5" />
                <rect x="26" y="26" width="48" height="4" fill="${skin.highlight}" opacity="0.6" />
                <rect x="26" y="26" width="4" height="38" fill="${skin.highlight}" opacity="0.4" />
                <rect x="30" y="48" width="8" height="6" fill="${skin.shadow}" opacity="0.35" />
                <rect x="30" y="30" width="6" height="4" fill="${skin.highlight}" opacity="0.5" />

                <!-- Ears -->
                <rect x="20" y="38" width="6" height="12" fill="${skin.base}" />
                <rect x="20" y="44" width="6" height="6" fill="${skin.shadow}" />
                <rect x="74" y="38" width="6" height="12" fill="${skin.shadow}" />

                <!-- Neck -->
                <rect x="36" y="64" width="28" height="16" fill="${skin.base}" />
                <rect x="56" y="64" width="8" height="16" fill="${skin.shadow}" />

                <!-- Clothing Layer -->
                ${clothing.draw()}

                <!-- Mouth Layer -->
                ${mouth.draw()}

                <!-- Eyes & Eyewear Layer -->
                ${eyewear.draw()}

                <!-- Hair / Headwear Layer -->
                ${headwear.draw()}

                <!-- Accessories Layer -->
                ${accessory.draw()}

                <!-- Canvas Pixel Border Outline -->
                <rect width="100" height="100" fill="none" stroke="#000000" stroke-width="1" opacity="0.2"/>
            </svg>`;
        }

        /* =========================================================
           SMART DNA GENERATOR (compatibility rules + contrast fix)
           ========================================================= */
        function pickCompatible(list, preferredTagPredicate, chance) {
            if (Math.random() < chance) {
                const matches = list.filter(preferredTagPredicate);
                if (matches.length) return matches[Math.floor(Math.random() * matches.length)];
            }
            return null;
        }

        function getRandomDNA() {
            let bg, skin, headwear, eyewear, mouth, clothing, accessory, aura;

            bg = getWeightedRandom(TRAITS.backgrounds);
            skin = getWeightedRandom(TRAITS.skins);

            // Contrast guarantee: retry against a shuffled background list if needed
            let contrastAttempts = 0;
            while (!hasGoodContrast(bg.mainColor, skin.base) && contrastAttempts < 15) {
                bg = getWeightedRandom(TRAITS.backgrounds);
                contrastAttempts++;
            }

            headwear = getWeightedRandom(TRAITS.headwear);
            clothing = getWeightedRandom(TRAITS.clothing);

            // Theme synergy rules
            if (hasTag(headwear, "samurai") && Math.random() < 0.7) {
                const alt = pickCompatible(TRAITS.clothing, c => hasTag(c, "samurai"), 1);
                if (alt) clothing = alt;
            }
            if (hasTag(headwear, "royal") && Math.random() < 0.6) {
                const alt = pickCompatible(TRAITS.clothing, c => hasTag(c, "royal"), 1);
                if (alt) clothing = alt;
            }
            if (headwear.name === "Golden Crown" && Math.random() < 0.5) {
                const alt = pickCompatible(TRAITS.clothing, c => hasTag(c, "royal") || hasTag(c, "gold"), 1);
                if (alt) clothing = alt;
            }
            if (hasTag(headwear, "space") && Math.random() < 0.7) {
                const alt = pickCompatible(TRAITS.clothing, c => hasTag(c, "space"), 1);
                if (alt) clothing = alt;
            }
            if (hasTag(skin, "cyber") && Math.random() < 0.4) {
                const alt = pickCompatible(TRAITS.clothing, c => hasTag(c, "cyber"), 1);
                if (alt) clothing = alt;
            }

            eyewear = getWeightedRandom(TRAITS.eyewear);

            // Full helmets force simple eyes underneath (avoid visual collision)
            if (hasTag(headwear, "helmet_full") && eyewear.name !== "Classic Eyes") {
                eyewear = TRAITS.eyewear[0];
            }
            if (hasTag(skin, "alien") && Math.random() < 0.5) {
                const alt = pickCompatible(TRAITS.eyewear, e => hasTag(e, "alien"), 1);
                if (alt && !hasTag(headwear, "helmet_full")) eyewear = alt;
            }
            if (hasTag(headwear, "cyber") && Math.random() < 0.35 && !hasTag(headwear, "helmet_full")) {
                const alt = pickCompatible(TRAITS.eyewear, e => hasTag(e, "cyber"), 1);
                if (alt) eyewear = alt;
            }

            mouth = getWeightedRandom(TRAITS.mouths);
            if (hasTag(skin, "zombie") && Math.random() < 0.45) {
                const alt = pickCompatible(TRAITS.mouths, m => hasTag(m, "fangs"), 1);
                if (alt) mouth = alt;
            }

            accessory = getWeightedRandom(TRAITS.accessories);
            if (hasTag(clothing, "luxury") && Math.random() < 0.5) {
                const alt = pickCompatible(TRAITS.accessories, a => hasTag(a, "gold") || hasTag(a, "diamond"), 1);
                if (alt) accessory = alt;
            }
            if (hasTag(skin, "zombie") && Math.random() < 0.3) {
                const alt = pickCompatible(TRAITS.accessories, a => a.name === "Scar", 1);
                if (alt) accessory = alt;
            }

            aura = getWeightedRandom(TRAITS.specialAuras);

            return {
                bgIndex: TRAITS.backgrounds.indexOf(bg),
                skinIndex: TRAITS.skins.indexOf(skin),
                headwearIndex: TRAITS.headwear.indexOf(headwear),
                eyewearIndex: TRAITS.eyewear.indexOf(eyewear),
                mouthIndex: TRAITS.mouths.indexOf(mouth),
                clothingIndex: TRAITS.clothing.indexOf(clothing),
                accessoryIndex: TRAITS.accessories.indexOf(accessory),
                auraIndex: TRAITS.specialAuras.indexOf(aura)
            };
        }

        function dnaTraits(dna) {
            return {
                bg: TRAITS.backgrounds[dna.bgIndex],
                skin: TRAITS.skins[dna.skinIndex],
                headwear: TRAITS.headwear[dna.headwearIndex],
                eyewear: TRAITS.eyewear[dna.eyewearIndex],
                mouth: TRAITS.mouths[dna.mouthIndex],
                clothing: TRAITS.clothing[dna.clothingIndex],
                accessory: TRAITS.accessories[dna.accessoryIndex],
                aura: TRAITS.specialAuras[dna.auraIndex]
            };
        }

        function generateSinglePreview() {
            const dna = getRandomDNA();
            const t = dnaTraits(dna);
            const rarityTier = overallRarity([t.bg, t.skin, t.headwear, t.eyewear, t.mouth, t.clothing, t.accessory, t.aura]);

            document.getElementById('svgPreviewContainer').innerHTML = buildSVG(dna);
            document.getElementById('traitDisplay').innerHTML = `
                Background: ${t.bg.name}<br>
                Skin: ${t.skin.name}<br>
                Headwear/Hair: ${t.headwear.name}<br>
                Eyewear: ${t.eyewear.name}<br>
                Mouth: ${t.mouth.name}<br>
                Clothing: ${t.clothing.name}<br>
                Accessory: ${t.accessory.name}<br>
                Special: ${t.aura.name}<br>
                <span class="rarity-tag" style="background:${RARITY_COLOR[rarityTier]}22; color:${RARITY_COLOR[rarityTier]}; border:1px solid ${RARITY_COLOR[rarityTier]};">Rarity: ${rarityTier}</span>
            `;
        }

        /* =========================================================
           BATCH GENERATION (up to 10,000, guaranteed-unique DNA)
           ========================================================= */
        async function startBatchGeneration() {
            const countInput = parseInt(document.getElementById('nftCount').value);
            const count = Math.min(Math.max(countInput || 1, 1), 10000);

            const btnGen = document.getElementById('btnGenerate');
            const btnPrev = document.getElementById('btnPreview');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressStatus = document.getElementById('progressStatus');

            btnGen.disabled = true;
            btnPrev.disabled = true;
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';

            const zip = new JSZip();
            const svgFolder = zip.folder("svg");
            const jsonFolder = zip.folder("json");
            const dnaSet = new Set();

            for (let i = 1; i <= count; i++) {
                let dna, dnaKey;
                let attempts = 0;

                // Guarantee unique DNA across the whole requested supply (up to 10,000)
                do {
                    dna = getRandomDNA();
                    dnaKey = `${dna.bgIndex}-${dna.skinIndex}-${dna.headwearIndex}-${dna.eyewearIndex}-${dna.mouthIndex}-${dna.clothingIndex}-${dna.accessoryIndex}-${dna.auraIndex}`;
                    attempts++;
                } while (dnaSet.has(dnaKey) && attempts < 50000);

                dnaSet.add(dnaKey);

                const t = dnaTraits(dna);
                const rarityTier = overallRarity([t.bg, t.skin, t.headwear, t.eyewear, t.mouth, t.clothing, t.accessory, t.aura]);
                const svgContent = buildSVG(dna);

                const metadata = {
                    name: `Pixel Character #${String(i).padStart(4, '0')}`,
                    description: `A premium collectible generative pixel character NFT from the official ${count}-piece collection.`,
                    image: `${i}.svg`,
                    dna: dnaKey,
                    edition: i,
                    attributes: [
                        { trait_type: "Background", value: t.bg.name },
                        { trait_type: "Skin", value: t.skin.name },
                        { trait_type: "Headwear", value: t.headwear.name },
                        { trait_type: "Eyewear", value: t.eyewear.name },
                        { trait_type: "Mouth", value: t.mouth.name },
                        { trait_type: "Clothing", value: t.clothing.name },
                        { trait_type: "Accessory", value: t.accessory.name },
                        { trait_type: "Special", value: t.aura.name },
                        { trait_type: "Rarity", value: rarityTier }
                    ]
                };

                svgFolder.file(`${i}.svg`, svgContent);
                jsonFolder.file(`${i}.json`, JSON.stringify(metadata, null, 2));

                if (i % 50 === 0 || i === count) {
                    const percent = (i / count) * 100;
                    progressFill.style.width = `${percent}%`;
                    progressStatus.innerText = `প্রসেসিং হচ্ছে: ${i} / ${count} (${Math.round(percent)}%)`;
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            progressStatus.innerText = `ZIP সংকুচিত করা হচ্ছে...`;

            zip.generateAsync({ type: "blob" }).then(function (content) {
                saveAs(content, `Premium_Pixel_NFT_Collection_${count}.zip`);
                btnGen.disabled = false;
                btnPrev.disabled = false;
                progressStatus.innerText = `ডাউনলোড সম্পন্ন হয়েছে! (${count} NFTs)`;
            });
        }

        // Initialize first preview on load
        generateSinglePreview();
    </script>
</body>
</html>
